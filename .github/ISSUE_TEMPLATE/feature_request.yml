name: 💡 Feature Request / Sugerir Recurso
description: Sugira uma nova funcionalidade ou melhoria para o NoxisTV / Suggest a new feature for NoxisTV
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema ou necessidade isso resolve? / What problem does this solve?
      placeholder: Ex.: Gostaria de suporte a controle remoto D-Pad para Android TV...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Como você imagina o recurso funcionando? / Describe the ideal solution
      placeholder: Detalhe sua sugestão de forma clara...
    validations:
      required: true
